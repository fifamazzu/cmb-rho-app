<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F0F11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CMB RHO" />
  <link rel="apple-touch-icon" href="/logo-cmb.png" />
  <title>C.M.B. RHO 1969 — DR4 Girone K</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F3F4F6;
      color: #0F0F11;
      -webkit-tap-highlight-color: transparent;
    }
    .hero-card-cmb {
      background: radial-gradient(circle at 88% 92%, rgba(204, 41, 24, 0.55) 0%, rgba(15, 15, 17, 0.96) 58%, #0B0B0D 100%);
    }
    .arena-banner {
      background:
        linear-gradient(180deg, rgba(11,11,13,0.25) 0%, rgba(11,11,13,0.88) 75%, #0B0B0D 100%),
        radial-gradient(circle at 50% 20%, rgba(204,41,24,0.45), rgba(15,15,17,0.95));
    }
    .glass-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="min-h-screen pb-24 select-none">

  <!-- TOP BAR COMPATTO E MODERNO -->
  <header class="sticky top-0 z-30 bg-[#0F0F11]/95 backdrop-blur-md text-white px-4 py-3 border-b border-white/10">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-[#CC2918] border border-white/30 flex items-center justify-center font-black text-xs overflow-hidden shrink-0 shadow-md">
          <img src="/logo-cmb.png" alt="CMB" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerText='CMB';" />
        </div>
        <div>
          <h1 class="font-extrabold text-base tracking-tight leading-none">
            C.M.B. RHO <span class="text-[#CC2918]">1969</span>
          </h1>
          <p class="text-[11px] text-zinc-400 mt-0.5 font-medium">DR4 Lombardia • Girone K • <span id="syncTime">Sync...</span></p>
        </div>
      </div>
      <button id="syncBtn" onclick="loadFipData(true)" class="bg-white/10 hover:bg-white/15 active:scale-95 text-white text-xs font-semibold px-3 py-2 rounded-xl border border-white/10 flex items-center gap-1.5 transition">
        <span id="syncIcon">↻</span>
        <span>Aggiorna</span>
      </button>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="max-w-md mx-auto px-3.5 pt-3.5 space-y-4">

    <!-- Box Errori -->
    <div id="errorBox" class="hidden bg-red-950 border border-[#CC2918] text-white p-4 rounded-2xl text-xs"></div>

    <!-- ========================================== -->
    <!-- SEZIONE 1: HOME (IDENTICA A FOTO 1)        -->
    <!-- ========================================== -->
    <section id="tab-home" class="space-y-4">
      <div id="homeContent" class="space-y-4">
        <div class="hero-card-cmb text-white rounded-3xl p-6 text-center text-xs text-zinc-400 shadow-xl">
          Sincronizzazione dati ufficiali FIP in corso...
        </div>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- SEZIONE 2: CALENDARIO (FOTO 2 + FILTRI)    -->
    <!-- ========================================== -->
    <section id="tab-calendar" class="hidden space-y-4">
      <!-- Hero Prossima Partita in cima (come nella Foto 2) -->
      <div id="calendarHeroBox"></div>

      <!-- Selettore Modalità Calendario -->
      <div class="bg-white p-1.5 rounded-2xl shadow-sm border border-gray-200/80 grid grid-cols-2 gap-1">
        <button id="calModeMonth" onclick="setCalendarMode('month')" class="py-2 rounded-xl text-xs font-bold bg-[#0F0F11] text-white transition">
          📅 Calendario Squadra
        </button>
        <button id="calModeLeague" onclick="setCalendarMode('league')" class="py-2 rounded-xl text-xs font-bold text-gray-500 hover:text-gray-900 transition">
          🏀 Tutte le Partite Girone
        </button>
      </div>

      <!-- SOTTO-VISTA A: CALENDARIO MENSILE + EVENTI (COME IN FOTO 2) -->
      <div id="calendarMonthView" class="space-y-4">
        <!-- Scelta squadra per il calendario mensile (di default C.M.B. RHO) -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-4">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-red-50 text-[#CC2918] flex items-center justify-center font-bold text-sm">
                📅
              </div>
              <div>
                <h2 class="font-bold text-sm text-gray-900">Calendario</h2>
                <p class="text-[11px] text-gray-400">Tutti gli eventi per squadra</p>
              </div>
            </div>
            <select id="monthTeamSelect" onchange="onMonthTeamChange()" class="bg-gray-100 text-gray-800 text-[11px] font-bold rounded-xl px-2.5 py-2 border-0 focus:ring-2 focus:ring-[#CC2918] max-w-[165px] truncate">
              <option value="CMB">C.M.B. RHO</option>
            </select>
          </div>

          <!-- Navigazione Mese -->
          <div class="flex items-center justify-between px-1 pt-1">
            <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 font-bold">‹</button>
            <div id="monthLabel" class="bg-gray-100 px-4 py-1.5 rounded-full text-xs font-bold text-gray-800 lowercase">
              ottobre 2026
            </div>
            <button onclick="changeMonth(1)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 font-bold">›</button>
          </div>

          <!-- Intestazione Giorni Settimana -->
          <div class="grid grid-cols-7 text-center text-[11px] font-semibold text-gray-400 pt-1">
            <div>L</div><div>M</div><div>M</div><div>G</div><div>V</div><div>S</div><div>D</div>
          </div>

          <!-- Griglia Giorni del Mese -->
          <div id="monthGrid" class="grid grid-cols-7 gap-y-2 text-center text-xs"></div>
        </div>

        <!-- Card Giorno Selezionato (es. Giovedì 29 Ottobre) -->
        <div id="selectedDateCard" class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100"></div>

        <!-- Card Prossimi Eventi della Squadra -->
        <div id="calendarUpcomingCard" class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100"></div>
      </div>

      <!-- SOTTO-VISTA B: ESPLORA CAMPIONATO PER GIORNATA O PER SQUADRA -->
      <div id="calendarLeagueView" class="hidden space-y-3">
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100 space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <button id="filterByRoundBtn" onclick="setLeagueFilterMode('round')" class="py-2 px-3 rounded-xl text-xs font-bold bg-[#CC2918] text-white transition">
              Per Giornata
            </button>
            <button id="filterByTeamBtn" onclick="setLeagueFilterMode('team')" class="py-2 px-3 rounded-xl text-xs font-bold bg-gray-100 text-gray-600 transition">
              Per Squadra
            </button>
          </div>

          <!-- Dropdown Giornate -->
          <div id="roundSelectWrapper">
            <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Seleziona Giornata del Campionato</label>
            <select id="roundSelect" onchange="renderLeagueMatches()" class="w-full bg-gray-50 text-gray-900 text-xs font-bold rounded-xl px-3 py-2.5 border border-gray-200 focus:outline-none">
              <option value="ALL">Tutte le Giornate</option>
            </select>
          </div>

          <!-- Dropdown Squadra (Tutte le partite di una singola squadra) -->
          <div id="teamSelectWrapper" class="hidden">
            <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Scegli la Squadra (22 Partite)</label>
            <select id="teamSelect" onchange="renderLeagueMatches()" class="w-full bg-gray-50 text-gray-900 text-xs font-bold rounded-xl px-3 py-2.5 border border-gray-200 focus:outline-none">
              <option value="ALL">Tutte le 12 Squadre</option>
            </select>
          </div>
        </div>

        <!-- Elenco Partite Filtrate -->
        <div id="matchesContainer" class="space-y-3"></div>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- SEZIONE 3: CLASSIFICA COMPLETA (PF/PS/DIFF)-->
    <!-- ========================================== -->
    <section id="tab-standings" class="hidden space-y-3">
      <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
        <div class="flex items-center justify-between mb-3 px-1">
          <div>
            <h2 class="text-sm font-extrabold text-gray-900">Classifica Girone K</h2>
            <p class="text-[11px] text-gray-400">Tocca una squadra per vedere tutte le sue partite</p>
          </div>
          <span class="bg-red-50 text-[#CC2918] text-[10px] font-black px-2.5 py-1 rounded-full uppercase">FIP Live</span>
        </div>
        <div id="standingsContainer" class="overflow-x-auto text-xs text-gray-400 py-4 text-center">
          Caricamento classifica...
        </div>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- SEZIONE 4: PALESTRE DEL GIRONE             -->
    <!-- ========================================== -->
    <section id="tab-gyms" class="hidden space-y-3">
      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-2">
        <span class="text-gray-400 text-sm">🔍</span>
        <input id="gymSearch" type="text" oninput="renderGyms()" placeholder="Cerca squadra o palestra del Girone K..." class="bg-transparent text-gray-900 text-xs font-medium w-full focus:outline-none" />
      </div>
      <div id="gymsContainer" class="space-y-3"></div>
    </section>

  </main>

  <!-- MODAL DETTAGLIO PARTITA -->
  <div id="matchModal" onclick="closeMatchModal(event)" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div onclick="event.stopPropagation()" class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl">
      <div id="matchModalContent"></div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR (STILE APP PREMIUM) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-gray-200 px-2 py-1.5">
    <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center">
      <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center justify-center py-1.5 rounded-2xl text-[#CC2918] bg-red-50/80 font-bold text-[11px] transition">
        <span class="text-base leading-none mb-0.5">🏠</span>
        <span>Home</span>
      </button>
      <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center justify-center py-1.5 rounded-2xl text-gray-400 font-semibold text-[11px] transition">
        <span class="text-base leading-none mb-0.5">📅</span>
        <span>Calendario</span>
      </button>
      <button onclick="switchTab('standings')" id="nav-standings" class="flex flex-col items-center justify-center py-1.5 rounded-2xl text-gray-400 font-semibold text-[11px] transition">
        <span class="text-base leading-none mb-0.5">🏆</span>
        <span>Classifica</span>
      </button>
      <button onclick="switchTab('gyms')" id="nav-gyms" class="flex flex-col items-center justify-center py-1.5 rounded-2xl text-gray-400 font-semibold text-[11px] transition">
        <span class="text-base leading-none mb-0.5">📍</span>
        <span>Palestre</span>
      </button>
    </div>
  </nav>

  <script>
    const GYMS = [
      { team: "C.M.B. RHO", gym: "Centro Sportivo Molinello", address: "Via Trecate 46, 20017 Rho (MI)", query: "Centro Sportivo Molinello Via Trecate Rho" },
      { team: "SAN PAOLO RHO", gym: "Palestra San Paolo Rho", address: "Via Cardinal Ferrari, Rho (MI)", query: "San Paolo Basket Rho Palestra" },
      { team: "VICTOR BASKET RHO", gym: "Palestra Victor Basket Rho", address: "Rho (MI)", query: "Victor Basket Rho Palestra" },
      { team: "UPN NERVIANO", gym: "Palestra Scuole Elementari", address: "Via Roma / Via L. da Vinci, 20014 Nerviano (MI)", query: "Via Leonardo da Vinci Nerviano Palestra" },
      { team: "BASKET PARABIAGO", gym: "Palazzetto dello Sport Parabiago", address: "Via Carso, Parabiago (MI)", query: "Palazzetto dello Sport Via Carso Parabiago" },
      { team: "CAPIT PERFORMANCE YELLOW MAGIC", gym: "Palestra Scolastica Arese", address: "Via Resegone 8, 20020 Arese (MI)", query: "Palestra Scolastica Via Resegone 8 Arese" },
      { team: "PALL. CERRO MAGGIORE", gym: "Palestra Comunale Cerro Maggiore", address: "Via Boccaccio, Cerro Maggiore (MI)", query: "Pallacanestro Cerro Maggiore Via Boccaccio" },
      { team: "SG.SPORT ARESE", gym: "PalaCICI (C.S. Davide Ancilotto)", address: "Piazza dello Sport 6, 20020 Arese (MI)", query: "Centro Sportivo Davide Ancilotto Piazza dello Sport 6 Arese" },
      { team: "BASKET CLUB ARLUNESE GIALLO", gym: "Palestra Comunale Arluno", address: "Via Damiano Chiesa, 20010 Arluno (MI)", query: "Palestra Comunale Via Damiano Chiesa Arluno" },
      { team: "BASKET CLUB ARLUNESE BLU", gym: "Palestra Comunale Arluno", address: "Via Damiano Chiesa, 20010 Arluno (MI)", query: "Palestra Comunale Via Damiano Chiesa Arluno" },
      { team: "SANGIORGESE BASKET", gym: "PalaBertelli", address: "Via del Campaccio, San Giorgio su Legnano (MI)", query: "PalaBertelli San Giorgio su Legnano" },
      { team: "S.LUIGI BASKET GARBAGNATE", gym: "Palestra OSL Garbagnate", address: "Garbagnate Milanese (MI)", query: "OSL Garbagnate Basket Palestra" }
    ];

    const MONTHS_NAMES = [
      "gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
      "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"
    ];
    const MONTHS_SHORT = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];
    const DAYS_SHORT = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
    const DAYS_FULL = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];

    let state = {
      standings: [],
      matches: [],
      nextCmbMatch: null,
      upcomingCmbMatches: [],
      todayNum: 0,
      calMode: "month", // 'month' | 'league'
      leagueFilterMode: "round", // 'round' | 'team'
      monthYear: { year: 2026, month: 9 }, // 9 = Ottobre (0-based)
      selectedDateStr: "", // 'DD/MM/YYYY'
      selectedMonthTeam: "CMB",
      countdownTimer: null
    };

    function switchTab(tab) {
      ["home", "calendar", "standings", "gyms"].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle("hidden", t !== tab);
        const btn = document.getElementById(`nav-${t}`);
        btn.className = t === tab
          ? "flex flex-col items-center justify-center py-1.5 rounded-2xl text-[#CC2918] bg-red-50/80 font-bold text-[11px] transition"
          : "flex flex-col items-center justify-center py-1.5 rounded-2xl text-gray-400 font-semibold text-[11px] transition";
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openMaps(query) {
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, "_blank");
    }

    function normalizeKey(str) {
      return (str || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function isSameTeam(a, b) {
      if (!a || !b) return false;
      const ka = normalizeKey(a);
      const kb = normalizeKey(b);
      return ka === kb || ka.includes(kb) || kb.includes(ka);
    }

    function formatLongDate(dateStr) {
      const m = (dateStr || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (!m) return dateStr || "Data da definire";
      const dd = parseInt(m[1], 10);
      const mm = parseInt(m[2], 10) - 1;
      const capMonth = MONTHS_NAMES[mm]
        ? MONTHS_NAMES[mm].charAt(0).toUpperCase() + MONTHS_NAMES[mm].slice(1)
        : "";
      return `${dd} ${capMonth} ${m[3]}`;
    }

    function formatShortEventDate(dateStr) {
      const m = (dateStr || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (!m) return dateStr;
      const dObj = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      const dayName = DAYS_SHORT[dObj.getDay()];
      const monthName = MONTHS_SHORT[Number(m[2]) - 1];
      return `${dayName} ${ parseInt(m[1], 10) } ${monthName}`;
    }

    function formatFullDayHeader(dateStr) {
      const m = (dateStr || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (!m) return dateStr;
      const dObj = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      const dayName = DAYS_FULL[dObj.getDay()];
      const monthName = MONTHS_NAMES[Number(m[2]) - 1];
      const capMonth = monthName.charAt(0).toUpperCase() + monthName.slice(1);
      return `${dayName} ${parseInt(m[1], 10)} ${capMonth}`;
    }

    function splitGymTitleAndSub(gymRaw) {
      if (!gymRaw) return { title: "Palestra Comunale", sub: "Lombardia" };
      const parts = gymRaw.split(",");
      const title = parts[0].trim();
      const sub = parts.slice(1).join(",").trim() || gymRaw;
      return { title, sub };
    }

    function buildHeroCardHtml(m, countdownTargetId) {
      if (!m) {
        return `
          <div class="hero-card-cmb text-white rounded-3xl p-6 text-center text-xs text-zinc-400 shadow-xl">
            Nessuna gara in programma trovata.
          </div>`;
      }

      const opponent = m.isCmbHome ? m.awayTeam : m.homeTeam;
      const badgeText = m.isCmbHome ? "IN CASA" : "TRASFERTA";
      const { title: gymShort } = splitGymTitleAndSub(m.gym);

      return `
        <div class="hero-card-cmb text-white rounded-3xl p-5 shadow-xl relative overflow-hidden">
          <!-- Top Row: Pill Prossima Partita + Badge Trasferta/Casa -->
          <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-white animate-pulse shadow-[0_0_8px_#fff]"></span>
              <span class="text-[11px] font-extrabold uppercase tracking-widest text-zinc-200">Prossima Partita</span>
            </div>
            <span class="glass-box text-white text-[10px] font-extrabold uppercase px-3 py-1 rounded-full tracking-wider">
              ${badgeText}
            </span>
          </div>

          <!-- Center Row: Icona Basket + VS Avversario + Pin Palestra -->
          <div class="flex items-center gap-4 my-5">
            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-[#CC2918] to-amber-600 p-0.5 shrink-0 shadow-lg">
              <div class="w-full h-full rounded-full bg-[#151518] flex items-center justify-center text-3xl">
                🏀
              </div>
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">VS</div>
              <div class="text-xl font-black leading-tight text-white break-words">
                ${opponent}
              </div>
              <div class="text-xs text-zinc-400 mt-1 flex items-center gap-1 truncate">
                <span>📍</span>
                <span class="truncate">${gymShort}</span>
              </div>
            </div>
          </div>

          <!-- Bottom Row: Countdown Boxes a sinistra + Ora e Data a destra -->
          <div class="flex items-end justify-between gap-2 pt-3 border-t border-white/10">
            <div id="${countdownTargetId}" class="flex items-center gap-1.5"></div>
            <div class="text-right shrink-0">
              <div class="text-xl font-black leading-none text-white">${m.time}</div>
              <div class="text-[11px] text-zinc-400 font-medium mt-1">${formatLongDate(m.date)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function updateCountdownBoxes(match, elementId) {
      const el = document.getElementById(elementId);
      if (!el || !match || !match.date.includes("/")) return;

      const [dd, mm, yyyy] = match.date.split("/").map(Number);
      const [hh, min] = match.time.includes(":")
        ? match.time.split(":").map(Number)
        : [21, 15];

      const target = new Date(yyyy, mm - 1, dd, hh, min, 0).getTime();
      const diff = target - Date.now();

      if (diff <= 0) {
        el.innerHTML = `
          <span class="bg-[#CC2918] text-white text-[11px] font-black px-3 py-1.5 rounded-xl uppercase tracking-wider">
            🔥 In Campo Ora
          </span>`;
        return;
      }

      const totalHours = Math.floor(diff / (1000 * 60 * 60));
      const days = Math.floor(totalHours / 24);
      const hours = totalHours % 24;
      const mins = Math.floor((diff / 1000 / 60) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      if (days > 0) {
        el.innerHTML = `
          <div class="text-center">
            <div class="glass-box rounded-xl px-2.5 py-1.5 text-sm font-black text-white">${String(days).padStart(2, "0")}</div>
            <div class="text-[8px] text-zinc-400 font-bold uppercase mt-1">GG</div>
          </div>
          <span class="text-zinc-500 font-bold text-xs -mt-3">:</span>
          <div class="text-center">
            <div class="glass-box rounded-xl px-2.5 py-1.5 text-sm font-black text-white">${String(hours).padStart(2, "0")}</div>
            <div class="text-[8px] text-zinc-400 font-bold uppercase mt-1">ORE</div>
          </div>
          <span class="text-zinc-500 font-bold text-xs -mt-3">:</span>
          <div class="text-center">
            <div class="glass-box rounded-xl px-2.5 py-1.5 text-sm font-black text-white">${String(mins).padStart(2, "0")}</div>
            <div class="text-[8px] text-zinc-400 font-bold uppercase mt-1">MIN</div>
          </div>`;
      } else {
        el.innerHTML = `
          <div class="text-center">
            <div class="glass-box rounded-xl px-2.5 py-1.5 text-sm font-black text-white">${String(totalHours).padStart(2, "0")}</div>
            <div class="text-[8px] text-zinc-400 font-bold uppercase mt-1">ORE</div>
          </div>
          <span class="text-zinc-500 font-bold text-xs -mt-3">:</span>
          <div class="text-center">

          updateCountdownBoxes(state.nextCmbMatch, "homeCountdown");
          updateCountdownBoxes(state.nextCmbMatch, "calCountdown");
        }

      tick();

      setLeagueFilterMode("team");

      for (const opt of teamSel.options) {

    function getMatchesForSelectedMonthTeam() {
      const sel = state.selectedMonthTeam;
      if (!sel || sel === "CMB") {
        return state.matches.filter(m => m.isCmb);
      }
      return state.matches.filter(m => isSameTeam(m.homeTeam, sel) || isSameTeam(m.awayTeam, sel));
    }

    function onMonthTeamChange() {
      state.selectedMonthTeam = document.getElementById("monthTeamSelect").value;
      renderMonthlyCalendar();
    }

    function changeMonth(delta) {
      let { year, month } = state.monthYear;
      month += delta;
      if (month < 0) { month = 11; year--; }
      if (month > 11) { month = 0; year++; }
      state.monthYear = { year, month };
      renderMonthlyCalendar();
    }

    function selectCalendarDate(dateStr) {
      state.selectedDateStr = dateStr;
      renderMonthlyCalendar();

    function renderMonthlyCalendar() {
      document.getElementById("calendarHeroBox").innerHTML = buildHeroCardHtml(state.nextCmbMatch, "calCountdown");

      const { year, month } = state.monthYear;
      document.getElementById("monthLabel").innerText = `${MONTHS_NAMES[month]} ${year}`;

      const teamMatches = getMatchesForSelectedMonthTeam();
      const matchDatesSet = new Set(teamMatches.map(m => m.date));

      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();

      // Converte indice giorno (Lunedì = 0 ... Domenica = 6)
      const startOffset = (firstDay.getDay() + 6) % 7;

      const cells = [];
      for (let i = startOffset - 1; i >= 0; i--) {
        cells.push(`<div class="py-2 text-gray-300 font-medium">${prevMonthDays - i}</div>`);
      }

      const todayStr = (() => {
        const s = String(state.todayNum);
        if (s.length !== 8) return "";
        return `${s.slice(6, 8)}/${s.slice(4, 6)}/${s.slice(0, 4)}`;
      })();

      for (let d = 1; d <= daysInMonth; d++) {
        const dd = String(d).padStart(2, "0");
        const mm = String(month + 1).padStart(2, "0");
        const fullDate = `${dd}/${mm}/${year}`;
        const hasMatch = matchDatesSet.has(fullDate);
        const isSelected = state.selectedDateStr === fullDate;
        const isToday = todayStr === fullDate;

        cells.push(`
          <button onclick="selectCalendarDate('${fullDate}')" class="flex flex-col items-center justify-center py-1 relative">
            <span class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs transition ${
              isSelected
                ? "bg-[#CC2918] text-white shadow-md"
                : isToday
                ? "bg-red-50 text-[#CC2918]"
                : "text-gray-800 hover:bg-gray-100"
            }">
              ${d}
            </span>
            <span class="w-1.5 h-1.5 rounded-full mt-0.5 ${
              hasMatch ? (isSelected ? "bg-[#0F0F11]" : "bg-[#CC2918]") : "bg-transparent"
            }"></span>
          </button>
        `);
      }

      const trailing = (7 - (cells.length % 7)) % 7;
      for (let i = 1; i <= trailing; i++) {
        cells.push(`<div class="py-2 text-gray-300 font-medium">${i}</div>`);
      }

      document.getElementById("monthGrid").innerHTML = cells.join("");

      // Renderizza Card del Giorno Selezionato (come in Foto 2)
      const dayMatches = teamMatches.filter(m => m.date === state.selectedDateStr);
      const dateCard = document.getElementById("selectedDateCard");
      const headerTitle = state.selectedDateStr
        ? formatFullDayHeader(state.selectedDateStr)
        : "Seleziona una data";

      if (dayMatches.length === 0) {
        dateCard.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="text-sm font-extrabold text-gray-900">${headerTitle}</h3>
              <p class="text-[11px] text-gray-400">Nessun evento</p>
            </div>
          </div>
          <div class="py-6 text-center space-y-2">
            <div class="w-11 h-11 rounded-2xl bg-gray-50 text-gray-400 flex items-center justify-center mx-auto text-lg">📅</div>
            <p class="text-xs font-bold text-gray-400">Nessuna partita in programma per questa data</p>
          </div>
        `;

        dateCard.innerHTML = `
          <div class="mb-3">
            <h3 class="text-sm font-extrabold text-gray-900">${headerTitle}</h3>
            <p class="text-[11px] text-[#CC2918] font-bold">${dayMatches.length} ${dayMatches.length === 1 ? "partita in programma" : "partite in programma"}</p>

          <div class="space-y-3">
            ${dayMatches.map(m => renderMatchCardHtml(m)).join("")}

        .filter(m => !m.played && m.dateNum >= state.todayNum)
        .sort((a, b) => a.dateNum - b.dateNum)

        <div class="flex items-center gap-3 mb-2">
          <div class="w-9 h-9 rounded-xl bg-red-50 text-[#CC2918] flex items-center justify-center font-bold text-sm">
            📅
          </div>
          <div>
            <h3 class="text-sm font-extrabold text-gray-900">Prossimi Eventi</h3>
            <p class="text-[11px] text-gray-400">Clicca per i dettagli</p>
          </div>
        </div>
        <div>
          ${renderUpcomingListHtml(upcomingForTeam)}
        </div>
      `;

      startGlobalCountdown();
    }

    async function loadFipData(force = false) {
      const icon = document.getElementById("syncIcon");
      const errBox = document.getElementById("errorBox");
      icon.classList.add("animate-spin");
      errBox.classList.add("hidden");

      try {
        const res = await fetch(`/api/fip${force ? "?force=1" : ""}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Errore lettura FIP");

        state.standings = data.standings || [];
        state.matches = data.matches || [];
        state.nextCmbMatch = data.nextCmbMatch || null;
        state.upcomingCmbMatches = data.upcomingCmbMatches || [];
        state.todayNum = data.todayNum || 20261029;

        // Imposta la data selezionata nel calendario sulla prossima partita del CMB
        if (!state.selectedDateStr && state.nextCmbMatch && state.nextCmbMatch.date.includes("/")) {
          state.selectedDateStr = state.nextCmbMatch.date;
          const [dd, mm, yyyy] = state.nextCmbMatch.date.split("/").map(Number);
          state.monthYear = { year: yyyy, month: mm - 1 };
        }

        document.getElementById("syncTime").innerText = (data.updatedAt || "").split(",")[1] || "OK";

        // Popola i menu a tendina delle Giornate
        if (data.availableRounds && data.availableRounds.length > 0) {
          const rSel = document.getElementById("roundSelect");
          rSel.innerHTML =
            '<option value="ALL">Tutte le Giornate</option>' +
            data.availableRounds.map(r => `<option value="${r.key}">${r.label}</option>`).join("");
          if (data.currentRoundKey) rSel.value = data.currentRoundKey;
        }

        // Popola i menu a tendina delle 12 Squadre
        const allTeams = state.standings.length > 0
          ? state.standings.map(s => s.team)
          : Array.from(new Set(state.matches.flatMap(m => [m.homeTeam, m.awayTeam])));

        const tSel = document.getElementById("teamSelect");
        tSel.innerHTML =
          '<option value="ALL">Tutte le 12 Squadre</option>' +
          allTeams.map(t => `<option value="${t}">${t}</option>`).join("");

        const mTeamSel = document.getElementById("monthTeamSelect");
        mTeamSel.innerHTML =
          '<option value="CMB">C.M.B. RHO</option>' +
          allTeams.filter(t => !isSameTeam(t, "C.M.B. RHO")).map(t => `<option value="${t}">${t}</option>`).join("");

        renderHome();
        renderMonthlyCalendar();
        renderLeagueMatches();
        renderStandings();
        startGlobalCountdown();
      } catch (e) {
        errBox.classList.remove("hidden");
        errBox.innerHTML = `<strong>Attenzione:</strong> ${e.message}`;
      } finally {
        icon.classList.remove("animate-spin");
      }
    }

    renderGyms();
    loadFipData(false);
  </script>
</body>
</html>
